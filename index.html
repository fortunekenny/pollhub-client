<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Create a poll or survey in under two minutes. Live results, real duplicate protection, free." />
    <title>PollHub</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (() => {
        const saved = localStorage.getItem('ph_theme');
        if (saved) document.documentElement.dataset.theme = saved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
